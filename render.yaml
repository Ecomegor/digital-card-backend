services:
  - type: web
    name: developer-card-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PRISMA_LOG_QUERIES
        value: 'false'
      - key: DATABASE_URL
        fromDatabase:
          name: developer-card-db
          property: connectionString

databases:
  - name: developer-card-db
    plan: free
    region: frankfurt
    databaseName: developer_card
    user: developer_card
    postgresMajorVersion: '17'
    ipAllowList: []
